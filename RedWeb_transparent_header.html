<!DOCTYPE html>
<HTML lang="ru">
<head>

    <title style="text-align: center;">Red Web</title>
    <link rel="icon" type="image/png" href="Lisa/LICAPNG.png">

<link rel="stylesheet" href="Moisait.CSS">
<style>
  
  body{margin:0;background:linear-gradient(135deg,#e7a778,#ffc28d,#ff7043);font-family:Arial,sans-serif;color:#222}
header{
    position: sticky;
    top: 0;
    z-index: 1000;
    padding: 12px 20px;
    background: rgba(255, 102, 0, 0.35);
    -webkit-backdrop-filter: blur(30px);
    backdrop-filter: blur(5px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 3px 15px rgba(0, 0, 0, 0.12);
}
.logo{font-size:24px;font-weight:800;color:#862200}
nav{display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:700;transition:.2s}
button:hover{transform:scale(1.05)}
.login{background:#ff5a2a;color:#ffffff}.reg{background:#333;color:#fff}.videoBtn{background:#ffca28}
#userInfo{font-size:14px}
.container{max-width:1000px;margin:auto;padding:25px 15px}
.card{background:rgba(255,255,255,.75);border-radius:18px;padding:20px;margin:18px 0;box-shadow:0 8px 25px #0002}
h1{text-align:center;color:#ff4800;font-family:"Courier New",monospace}
.about{text-align:center;background:#111;color:#fff;border-radius:18px;padding:15px}
.about p,.about h4{background:#a5a5a5;color:#111;padding:8px;margin:8px;border-radius:6px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.cats img{width:100%;max-height:230px;object-fit:contain;border-radius:10px}
#videos{display:none}
.video-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.video-card{background:#fff;border-radius:16px;padding:12px;box-shadow:0 5px 15px #0002}
.video-card iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px}
#loginNotice{display:none}
.small{opacity:.75;font-size:13px}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
}
.wide { grid-column: span 2; }
</style>
<body style="background-color: rgb(231, 167, 120);">

  </nav>
</header>
